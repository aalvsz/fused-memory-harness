[project]
name = "fused-memory-harness"
version = "0.1.0"
description = "Reproducible multi-signal retrieval harness for long-term agent memory"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastembed>=0.7.0,<1.0.0",
    "google-genai>=1.0.0,<2.0.0",
    "numpy>=1.26.0,<3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0,<9.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["experiments", "fused_memory_harness"]

[tool.pytest.ini_options]
testpaths = ["tests"]
